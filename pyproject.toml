[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "adb-storage-cleaner"
version = "0.2.3"
description = "不 Root、纯 ADB 的安卓存储审计与安全清理工具（默认只读，白名单删除）"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "KKKKahn" }]
keywords = [
  "android",
  "adb",
  "storage",
  "cleaner",
  "no-root",
  "live-photo",
  "live-photo-compression",
  "cli",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Utilities",
  "Topic :: System :: Systems Administration",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.6"]

[project.scripts]
adbclean = "adbclean.cli:main"

[project.urls]
Homepage = "https://github.com/KKKKahn/adb-storage-cleaner"
Issues = "https://github.com/KKKKahn/adb-storage-cleaner/issues"
Changelog = "https://github.com/KKKKahn/adb-storage-cleaner/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
adbclean = ["web/*"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
