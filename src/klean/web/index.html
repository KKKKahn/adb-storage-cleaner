<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>
  try {
    var savedTheme = localStorage.getItem('klean-theme');
    if (savedTheme === 'light' || savedTheme === 'dark') {
      document.documentElement.dataset.theme = savedTheme;
    }
  } catch (error) {}
</script>
<meta name="klean-token" content="__KLEAN_TOKEN__">
<title>Klean Studio · 实况照片压缩</title>
<link rel="stylesheet" href="/static/style.css?v=0.6.0">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <div class="logo" aria-hidden="true"><span class="bolt"></span></div>
    <div>
      <h1>Klean Studio</h1>
      <p class="sub" id="device-line">正在读取设备信息…</p>
    </div>
  </div>
  <div class="top-stats">
    <div class="stat"><span id="total-pairs">–</span><label>实况照片</label></div>
    <div class="stat"><span id="total-size">–</span><label>伴生 MP4</label></div>
    <div class="stat" title="电脑上的实况与视频原片备份总占用">
      <span id="backup-size">–</span><label>原片备份</label>
    </div>
  </div>
  <div class="top-actions">
    <button id="backup-btn" class="ghost backup-open-btn" type="button" title="查看、预览、恢复和清除原片备份">
      <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M4 7.5h16v11a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 4 18.5z"></path>
        <path d="M3 4.5h18v3H3zM9.5 12h5"></path>
      </svg>
      <span>备份管理</span>
    </button>
    <button id="mode-btn" class="ghost" type="button">模式</button>
    <button id="theme-btn" class="ghost theme-toggle" type="button" aria-label="切换到深色主题" title="切换到深色主题">
      <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round">
        <circle cx="12" cy="12" r="4"></circle>
        <path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.66 6.34l1.41-1.41"></path>
      </svg>
    </button>
    <button id="refresh-btn" class="ghost" type="button">刷新</button>
    <button id="rescan-btn" class="ghost" type="button">重新扫描</button>
  </div>
</header>

<div class="layout">
  <aside class="sidebar">
    <div class="side-tabs" role="tablist">
      <button id="tab-date" class="side-tab active" type="button">按日期</button>
      <button id="tab-album" class="side-tab" type="button">按相册</button>
    </div>
    <div class="search-wrap">
      <input id="search" type="search" placeholder="搜索日期，如 2026-10" autocomplete="off">
    </div>
    <div class="side-summary">
      <span id="selection-summary">未选择</span>
    </div>
    <nav id="month-list" class="month-list" aria-label="按日期或相册浏览"></nav>
  </aside>

  <main class="content" id="content">
    <section id="job-panel" class="panel hidden" aria-live="polite">
      <div class="panel-head">
        <div class="panel-title">
          <h3 id="job-title">任务</h3>
          <span id="job-counts" class="job-counts"></span>
        </div>
        <div class="panel-head-right">
          <span id="job-status" class="pill"></span>
          <button id="job-collapse" class="link" type="button">收起详情</button>
        </div>
      </div>
      <div class="progress"><div id="job-progress"></div></div>
      <p id="job-message" class="sub"></p>
      <div id="job-items" class="result-list"></div>
      <div id="job-actions" class="panel-actions"></div>
    </section>

    <div class="content-top">
      <div class="content-head">
        <div>
          <div class="head-title-line">
            <h2 id="view-title">最近的照片</h2>
            <span id="session-saved" class="session-saved" title="本次打开应用后，已应用到手机的压缩累计节省空间">
              本次已节省 <strong id="session-saved-value">0 B</strong>
            </span>
          </div>
          <p id="view-sub" class="sub">正在加载…</p>
        </div>
        <div class="view-actions">
          <button id="select-scope-btn" class="ghost" type="button">全选本日</button>
          <button id="selected-view-btn" class="ghost" type="button">已选 0</button>
        </div>
      </div>

      <div class="filter-bar">
        <label class="inline-field">
          <span>体积</span>
          <select id="size-filter">
            <option value="0">全部</option>
            <option value="2000000">≥ 2 MB</option>
            <option value="4000000">≥ 4 MB</option>
            <option value="8000000">≥ 8 MB</option>
            <option value="16000000">≥ 16 MB</option>
          </select>
        </label>
        <div class="inline-field status-filter">
          <span>显示</span>
          <div id="compressed-filter" class="filter-seg" role="group" aria-label="压缩状态筛选">
            <button type="button" class="filter-seg-btn active" data-value="all" aria-pressed="true">全部</button>
            <button type="button" class="filter-seg-btn" data-value="uncompressed" aria-pressed="false">未压缩</button>
            <button type="button" class="filter-seg-btn" data-value="compressed" aria-pressed="false">已压缩</button>
          </div>
        </div>
        <label class="inline-field">
          <span>排序</span>
          <select id="sort-select">
            <option value="time" selected>按时间</option>
            <option value="size">按体积从大到小</option>
          </select>
        </label>
        <button id="largest-btn" class="ghost" type="button">选最大的 50 个</button>
        <span id="filter-hint" class="sub"></span>
      </div>
      <div class="range-bar">
        <span class="range-label">按日期范围</span>
        <input id="range-start" type="date" aria-label="开始日期">
        <span class="range-sep">—</span>
        <input id="range-end" type="date" aria-label="结束日期">
        <button id="range-select" class="ghost" type="button">选中范围内</button>
        <span id="range-hint" class="sub"></span>
      </div>

      <div id="notice" class="notice hidden"></div>
    </div>

    <div id="grid" class="grid"></div>
    <div id="empty" class="empty hidden">
      <div class="empty-art" aria-hidden="true"></div>
      <p>这里还没有可显示的照片。</p>
      <p class="sub">选择左侧的日期，或等待扫描完成。</p>
    </div>
    <div id="load-more-wrap" class="load-more hidden">
      <button id="load-more" class="ghost" type="button">加载更多</button>
    </div>
  </main>
</div>

<div class="compress-bar">
  <div class="selection-info">
    <div class="selection-line">
      <div><strong id="selected-count">0</strong> 个已选 · <span id="selected-size">0 B</span></div>
      <button id="clear-selected-btn" class="link clear-selected-btn" type="button" disabled>清空已选</button>
    </div>
    <div id="selection-estimate" class="sub"></div>
  </div>
  <div class="compress-controls">
    <button id="bar-selected-btn" class="ghost" type="button">查看已选</button>
    <label class="field">
      <span>压缩档位</span>
      <select id="preset">
        <option value="visually_lossless">视觉无损 · CRF18</option>
        <option value="balanced" selected>推荐 · CRF20</option>
        <option value="small">小体积 · CRF23</option>
        <option value="custom">自定义 CRF</option>
        <option value="lossless">无损重封装（体积几乎不变）</option>
      </select>
    </label>
    <label class="field">
      <span>编码速度</span>
      <select id="speed-select">
        <option value="hardware">硬件加速（最快）</option>
        <option value="veryfast" selected>快（推荐）</option>
        <option value="medium">均衡</option>
        <option value="slow">最小体积（慢）</option>
      </select>
    </label>
    <label class="field hidden" id="crf-field">
      <span>CRF</span>
      <input id="crf" type="number" min="14" max="30" value="20">
    </label>
    <label class="check-field" title="SSIM 需要额外解码两段视频，会明显变慢">
      <input id="ssim-toggle" type="checkbox">
      <span>计算 SSIM（慢）</span>
    </label>
    <label class="check-field" title="已压缩照片只有选择更高 CRF / 更小体积档位时才会再次处理">
      <input id="recompress-toggle" type="checkbox">
      <span>允许更深压缩</span>
    </label>
    <button id="compress-btn" class="primary" type="button" disabled>压缩所选</button>
  </div>
</div>

<div id="modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="modal-title">
  <div class="modal-card">
    <h3 id="modal-title"></h3>
    <div id="modal-body" class="modal-body"></div>
    <div class="modal-actions">
      <button id="modal-cancel" class="ghost" type="button">取消</button>
      <button id="modal-ok" class="primary" type="button">确认</button>
    </div>
  </div>
</div>

<div id="preview" class="modal hidden" role="dialog" aria-modal="true" aria-label="视频预览">
  <div class="modal-card preview-card">
    <div class="panel-head">
      <h3 id="preview-title">预览</h3>
      <button id="preview-close" class="ghost" type="button">关闭</button>
    </div>
    <video id="preview-video" controls playsinline></video>
    <p id="preview-sub" class="sub"></p>
  </div>
</div>

<div id="toast" class="toast hidden" role="status"></div>

<script src="/static/app.js?v=0.6.0"></script>
<script src="/static/backups.js?v=0.6.0"></script>
</body>
</html>
